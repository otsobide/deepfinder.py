name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - name: Clone and checkout branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install project
        run: make install

      - name: Check the tag matches the package version
        run: |
          tag='${{ github.event.release.tag_name }}'
          version="$(python -c 'import deepfinder; print(deepfinder.__version__)')"
          if [ "${tag#v}" != "$version" ]; then
            echo "Release tag $tag does not match deepfinder.__version__ $version" >&2
            exit 1
          fi

      - name: Lint, type check and test
        run: make check

      - name: Build distributions
        run: make build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: Upload release to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/deepfinder
    permissions:
      id-token: write
    steps:
      - name: Download the distributions that were just tested
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
